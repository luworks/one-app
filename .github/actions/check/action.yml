name: Today planned dev check
description: Run a single integrated-SHA check through the integration-owned dev adapter
inputs:
  lane:
    description: Fixed CI lane name
    required: true
runs:
  using: composite
  steps:
    - name: Plan routine compiler module cache
      if: contains(inputs.lane, 'core-ui') || inputs.lane == 'integration' || inputs.lane == 'snapshots'
      id: modules
      shell: bash
      env:
        TODAY_LANES: ${{ inputs.lane }}
      run: |
        export TODAY_LANE="${TODAY_LANES%% *}"
        case "$TODAY_LANES" in
          integration) scheme=TodayTests ;;
          snapshots) scheme=TodaySnapshotTests ;;
          core-ui) scheme=TodayMock ;;
          "build integration snapshots core-ui") scheme=TodayCI ;;
        esac
        ./dev plan --scheme "$scheme" --architecture arm64 > "$RUNNER_TEMP/native-plan.json"
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'native-plan.json').read_text())
        cache = plan['compiler_module_cache']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for field in ('prefix', 'key', 'path'):
                output.write(field + '=' + cache[field] + '\n')
        PY
    - name: Restore routine compiler modules
      if: steps.modules.outputs.key != ''
      id: module-restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        # Exclude session-validation sentinels, products, build databases and
        # results. The compiler must validate modules in this fresh session.
        path: |
          ${{ steps.modules.outputs.path }}/**/*.pcm
          ${{ steps.modules.outputs.path }}/**/*.swiftmodule
        key: ${{ steps.modules.outputs.key }}
        restore-keys: ${{ steps.modules.outputs.prefix }}
        lookup-only: false
    - shell: bash
      env:
        TODAY_LANES: ${{ inputs.lane }}
      run: |
        read -ra lanes <<< "$TODAY_LANES"
        python3 scripts/ci/run.py "${lanes[@]}"
    - if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: today-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/today-artifacts-*/
        if-no-files-found: warn
        retention-days: 7
        include-hidden-files: true
    - name: Save successful routine compiler modules
      if: success() && steps.modules.outputs.key != '' && steps.module-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ${{ steps.modules.outputs.path }}/**/*.pcm
          ${{ steps.modules.outputs.path }}/**/*.swiftmodule
        key: ${{ steps.modules.outputs.key }}
