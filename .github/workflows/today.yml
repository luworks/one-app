name: Today CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: Explicit extended or release validation (never distributes)
        type: choice
        required: true
        options: [extended, integration, snapshots, release, sanitizer, performance, protected-release]
permissions:
  contents: read
concurrency:
  group: today-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  TODAY_CI_SYNTHETIC: '1'
jobs:
  today-required:
    if: always()
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: ./dev test helpers
      - name: Validate PR risk or merged-main usability
        uses: ./.github/actions/check
        with:
          lane: routine
  extended:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      MANUAL_LANE: ${{ inputs.lane }}
    environment: ${{ inputs.lane == 'protected-release' && 'release-validation' || '' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify configured release protection
        if: inputs.lane == 'protected-release'
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release_guard.py
      - run: python3 scripts/ci/prerequisite.py
      - uses: ./.github/actions/check
        with:
          lane: ${{ inputs.lane }}
