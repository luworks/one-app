name: Today CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the complete logic, integration, snapshot and UI suites (manual, ~25 min)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: today-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./dev bootstrap --tool swift-format --tool swiftlint --tool ruff --tool actionlint
      - run: ./dev format --check
      - run: ./dev lint
      - run: ./dev test helpers
      - run: ./dev test unit
  today-required:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/today-smoke/dd/SourcePackages
          key: spm-${{ hashFiles('ios/Dependencies/Package.resolved') }}
      # Reuse simulator devices that already finished first-boot setup on this runner image
      # (~1.3 GB, synthetic smoke data only); a miss saves them after a green smoke.
      - id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: sim
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-devices-${{ steps.image.outputs.version }}-v1
      - run: python3 scripts/ci/smoke.py
        env:
          SIM_CACHE_HIT: ${{ steps.sim.outputs.cache-hit }}
      - if: success() && steps.sim.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-devices-${{ steps.image.outputs.version }}-v1
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/today-smoke/smoke.xcresult
          if-no-files-found: ignore
          retention-days: 7
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./dev bootstrap --tool xcodegen
      - run: ./dev test release --full --timeout 1800
