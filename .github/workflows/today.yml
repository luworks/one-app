name: Today CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: install-smoke = Simulator usability gate required before a phone install; full = complete suites
        type: choice
        options: [install-smoke, full]
        default: install-smoke
permissions:
  contents: read
concurrency:
  group: today-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/ci/smoke.py --command ./dev bootstrap --tool swift-format --tool swiftlint --tool ruff --tool actionlint
      - run: python3 scripts/ci/smoke.py --command ./dev format --check
      - run: python3 scripts/ci/smoke.py --command ./dev lint
      - run: python3 scripts/ci/smoke.py --command ./dev test helpers
      - run: python3 scripts/ci/smoke.py --command ./dev test qa
      - run: python3 scripts/ci/smoke.py --command ./dev test unit
      # Export allowlisted diagnostics only; raw command bytes remain runner-local/private.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checks-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/today-smoke/failure
          if-no-files-found: warn
          retention-days: 7
  # Merge gate: build the app, widget and share extension plus test bundles. No simulator.
  today-required:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/today-smoke/dd/SourcePackages
          key: spm-${{ hashFiles('ios/Dependencies/Package.resolved') }}
      - run: python3 scripts/ci/smoke.py --build-only
      # Export allowlisted diagnostics only; raw command bytes remain runner-local/private.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/today-smoke/failure
          if-no-files-found: warn
          retention-days: 7
  # Install gate, run explicitly on main before any phone install. Never installs a phone.
  install-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'install-smoke'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/today-smoke/dd/SourcePackages
          key: spm-${{ hashFiles('ios/Dependencies/Package.resolved') }}
      # Reuse simulator devices that already finished first-boot setup on this runner image
      # (~1.3 GB, synthetic smoke data only); a miss saves them once the device shut down cleanly.
      - id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: sim
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-devices-${{ steps.image.outputs.version }}-v1
      - id: smoke
        run: python3 scripts/ci/smoke.py
        env:
          SIM_CACHE_HIT: ${{ steps.sim.outputs.cache-hit }}
      # Save whenever the device was shut down cleanly: a failed cold run must not stay cold.
      - if: always() && steps.smoke.outputs.device == 'clean'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/CoreSimulator/Devices
          key: sim-devices-${{ steps.image.outputs.version }}-v1
      # Export allowlisted diagnostics only; raw command bytes remain runner-local/private.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: smoke-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/today-smoke/failure
          if-no-files-found: warn
          retention-days: 7
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'full'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./dev bootstrap --tool xcodegen
      - run: ./dev test release --full --timeout 1800
