{
  "name": "Today",
  "options": {
    "minimumXcodeGenVersion": "2.46.0",
    "settingPresets": "none",
    "developmentLanguage": "en"
  },
  "configs": {
    "Debug": "debug",
    "Release": "release"
  },
  "configFiles": {
    "Debug": "Config/Project-Debug.xcconfig",
    "Release": "Config/Project-Release.xcconfig"
  },
  "targets": {
    "Today": {
      "type": "application",
      "platform": "iOS",
      "configFiles": {
        "Debug": "Config/Today-Debug.xcconfig",
        "Release": "Config/Today-Release.xcconfig"
      },
      "sources": [
        {
          "path": "App"
        },
        {
          "path": "One",
          "excludes": [
            "**/.DS_Store"
          ]
        },
        {
          "path": "PrivacyInfo.xcprivacy",
          "buildPhase": "resources"
        }
      ],
      "dependencies": [
        {
          "target": "TodayWidgets",
          "embed": true
        },
        {
          "target": "TodayShare",
          "embed": true
        },
        {
          "package": "TodayModules",
          "product": "One"
        },
        {
          "package": "TodayModules",
          "product": "TodayShell"
        },
        {
          "package": "TodayModules",
          "product": "TodayCore"
        },
        {
          "package": "TodayModules",
          "product": "TodayPlatform"
        },
        {
          "package": "TodayModules",
          "product": "FeatureHealth"
        }
      ],
      "productName": "One"
    },
    "TodayShare": {
      "type": "app-extension",
      "platform": "iOS",
      "configFiles": {
        "Debug": "Config/TodayShare-Debug.xcconfig",
        "Release": "Config/TodayShare-Release.xcconfig"
      },
      "sources": [
        {
          "path": "ShareExtension",
          "excludes": [
            "**/.DS_Store"
          ]
        },
        {
          "path": "Sources/One/AlarmActivity.swift",
          "excludes": [
            "**/.DS_Store"
          ]
        }
      ],
      "productName": "ShareExtension",
      "dependencies": [
        {
          "package": "TodayModules",
          "product": "TodayShared"
        }
      ]
    },
    "TodayUITests": {
      "type": "bundle.ui-testing",
      "platform": "iOS",
      "configFiles": {
        "Debug": "Config/TodayUITests-Debug.xcconfig",
        "Release": "Config/TodayUITests-Release.xcconfig"
      },
      "sources": [
        {
          "path": "OneUITests",
          "excludes": [
            "**/.DS_Store"
          ]
        }
      ],
      "dependencies": [
        {
          "target": "TodayMock"
        }
      ],
      "productName": "OneUITests"
    },
    "TodayWidgets": {
      "type": "app-extension",
      "platform": "iOS",
      "configFiles": {
        "Debug": "Config/TodayWidgets-Debug.xcconfig",
        "Release": "Config/TodayWidgets-Release.xcconfig"
      },
      "sources": [
        {
          "path": "TodayWidgets",
          "excludes": [
            "**/.DS_Store"
          ]
        },
        {
          "path": "Sources/One/AlarmActivity.swift",
          "excludes": [
            "**/.DS_Store"
          ]
        }
      ],
      "dependencies": [
        {
          "package": "TodayModules",
          "product": "TodayShared"
        }
      ]
    },
    "TodayMock": {
      "type": "application",
      "platform": "iOS",
      "configFiles": {
        "Debug": "Config/TodayMock-Debug.xcconfig",
        "Release": "Config/TodayMock-Release.xcconfig"
      },
      "sources": [
        {
          "path": "App"
        },
        {
          "path": "One",
          "excludes": [
            "**/.DS_Store"
          ]
        },
        {
          "path": "PrivacyInfo.xcprivacy",
          "buildPhase": "resources"
        },
        {
          "path": "Development/Support"
        }
      ],
      "dependencies": [
        {
          "target": "TodayWidgets",
          "embed": true
        },
        {
          "target": "TodayShare",
          "embed": true
        },
        {
          "package": "TodayModules",
          "product": "One"
        },
        {
          "package": "TodayModules",
          "product": "TodayShell"
        },
        {
          "package": "TodayModules",
          "product": "TodayCore"
        },
        {
          "package": "TodayModules",
          "product": "TodayPlatform"
        },
        {
          "package": "TodayModules",
          "product": "FeatureHealth"
        },
        {
          "package": "TodayModules",
          "product": "TodayTestSupport"
        },
        {
          "package": "TodayModules",
          "product": "TodayShared"
        },
        {
          "package": "TodayModules",
          "product": "TodayData"
        },
        {
          "package": "TodayModules",
          "product": "TodayDesignSystem"
        },
        {
          "package": "TodayModules",
          "product": "FeatureReminders"
        },
        {
          "package": "TodayModules",
          "product": "FeatureCalendar"
        },
        {
          "package": "TodayModules",
          "product": "FeatureClock"
        }
      ],
      "productName": "TodayMock"
    }
  },
  "schemes": {
    "Today": {
      "build": {
        "targets": {
          "Today": "all"
        }
      },
      "run": {
        "config": "Debug"
      },
      "test": {
        "config": "Debug",
        "targets": [],
        "gatherCoverageData": false
      },
      "profile": {
        "config": "Release"
      },
      "archive": {
        "config": "Release"
      }
    },
    "TodayMock": {
      "build": {
        "targets": {
          "TodayMock": "all"
        }
      },
      "run": {
        "config": "Debug"
      },
      "test": {
        "config": "Debug",
        "targets": [
          "TodayUITests"
        ],
        "gatherCoverageData": true
      }
    }
  },
  "packages": {
    "TodayModules": {
      "path": "."
    }
  }
}
